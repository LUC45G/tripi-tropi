<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tripi-tropi · Local tickets</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
  <script src="/vendor/marked.js" defer></script>
  <script src="/vendor/purify.js" defer></script>
  <script src="/vendor/gsap.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="tripi-tropi home"><img class="brand-mark" src="/icon.svg" alt="">tripi-tropi <span id="skill-version" class="version-badge" aria-label="Skill version">version</span></a>
    <span class="repo-name" id="repo-name">Local tickets</span>
    <div class="session-control">
      <button class="queue-session" id="queue-session" type="button" title="No Codex session linked" aria-haspopup="menu" aria-expanded="false" aria-controls="session-menu" disabled>Codex: not linked</button>
      <div class="session-menu" id="session-menu" role="menu" aria-label="Queue destination" hidden></div>
    </div>
    <div class="session-backdrop" id="session-backdrop" hidden></div>
    <span class="live-status" id="live-status" role="status" title="Connection for automatic updates from local files">Connecting…</span>
    <button class="refresh" id="refresh" type="button">Refresh</button>
    <button class="refresh" id="exit-viewer" type="button" data-control-token="__VIEWER_TOKEN__">Exit</button>
    <span id="exit-status" class="muted" role="status" hidden></span>
  </header>
  <div id="error" role="alert" hidden></div>
  <main class="workspace">
    <aside class="sidebar" id="feature-sidebar" aria-label="Features">
      <div class="panel-heading"><h1>Features</h1><span id="feature-count" class="count">0</span></div>
      <nav id="features" aria-label="Choose a feature"></nav>
      <div class="sidebar-note"><button id="toggle-sidebar" class="refresh sidebar-toggle" type="button" aria-label="Collapse features sidebar" aria-expanded="true" aria-controls="feature-sidebar"><span aria-hidden="true">‹</span></button></div>
    </aside>
    <div class="splitter" id="sidebar-splitter" role="separator" aria-label="Resize feature sidebar" aria-orientation="vertical" tabindex="0" aria-valuemin="160" aria-valuemax="400" aria-valuenow="220"></div>
    <section class="tickets-pane" aria-label="Tickets">
      <div class="panel-heading"><div><h2 id="list-title">Tickets</h2></div><span id="ticket-count" class="count">0</span></div>
      <div class="filters" aria-label="Ticket filters">
        <div class="filter-field"><span id="status-title" class="filter-title">Status</span><details class="filter-dropdown" id="status-filter"><summary id="status-summary" aria-describedby="status-title">All states</summary><div id="state-options" class="filter-options" aria-label="Choose status"></div></details><input id="state-filter" type="hidden" value=""></div>
        <div class="filter-field"><span id="labels-title" class="filter-title">Labels</span><details class="filter-dropdown" id="label-filter"><summary id="label-summary" aria-describedby="labels-title">All labels</summary><div id="label-options" class="filter-options" aria-label="Choose labels"></div></details></div>
        <button id="clear-filters" class="clear-filters" type="button" disabled>Clear filters</button>
      </div>
      <div id="ticket-list" class="table-scroll"><p class="empty">Loading local tickets…</p></div>
    </section>
    <div class="splitter" id="detail-splitter" role="separator" aria-label="Resize ticket and detail panels" aria-orientation="vertical" tabindex="0" aria-valuemin="25" aria-valuemax="75" aria-valuenow="50"></div>
    <section class="detail-pane" aria-label="Selected detail" tabindex="-1">
      <div class="detail-toolbar"><span id="detail-kind">Overview</span><span id="detail-path"></span></div>
      <div id="detail" class="detail-content"><p class="empty">Select a feature or ticket to read its description.</p></div>
    </section>
  </main>
  <nav class="mobile-tabs" aria-label="Workspace view"><button type="button" data-mobile-view="list" aria-pressed="true">Tickets</button><button type="button" data-mobile-view="detail" aria-pressed="false">Detail</button></nav>
</body>
</html>
